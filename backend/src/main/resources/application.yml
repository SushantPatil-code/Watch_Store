server:
#  port: 8082
   port : ${PORT:8082}
   address: 0.0.0.0

spring:
  application:
    name: WatchStore

  datasource:
#    url: jdbc:mysql://localhost:3306/watch_store?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#    username: root
#    password: 123456
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
#    driver-class-name: com.mysql.cj.jdbc.Driver
#    url : jdbc:postgresql://localhost:5433/WatchStore
#    username: postgres
#    password : system
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
#        dialect: org.hibernate.dialect.MySQLDialect
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  jwt:
#    secret: "7M@9qX#2Lp!8Za$4Nv%6Rt&1Hy*5Kd3Ws^0Fg"
    secret: ${JWT_SECRET}
    expiration-minutes: 1440

  cors:
#    allowed-origin: http://localhost:4200
     allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}